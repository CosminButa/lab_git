{% extends "base.html" %}
{% block title %}Parolă resetată{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Parolă resetată în {{ client.label }}</h1>
  <p>Noua parolă pentru <strong>{{ username }}</strong>, afișată o singură dată:</p>
  <p class="secret">{{ shown_password }}</p>
  <a class="btn" href="{{ url_for('platforms.user_detail', key=client.key, username=username) }}">Înapoi la utilizator</a>
</section>
{% endblock %}
