apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: account-manager
resources:
  - namespace.yaml
  - pvc.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
# Secrets are intentionally NOT listed here. Create them out of band (see README):
#   account-manager-secrets  (SECRET_KEY, BOOTSTRAP_ADMIN_*, platform tokens)
#   nexus-registry           (docker-registry pull secret for the private image)
images:
  - name: account-manager
    newName: nexus.example.com/account-manager   # <- registry-ul tău Nexus
    newTag: "1.0.0"
